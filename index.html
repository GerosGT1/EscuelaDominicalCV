<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1e3564" />
    <meta name="description" content="Plataforma interactiva para el estudio bíblico y formación cristiana - Escuela Dominical Asambleas de Dios, Auditorium Cristo Viene" />
    <link rel="icon" type="image/png" href="/logos/logo-escuela-dominical.png" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <title>Escuela Dominical Digital · Asambleas de Dios</title>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('edd-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
